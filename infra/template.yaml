AWSTemplateFormatVersion: "2010-09-09"
Description: elixir-mcp - Clash Royale history recorder and MCP server (unofficial, not endorsed by Supercell)

# One stack (docs/ENGINEERING.md). NAT-free VPC: DB-touching Lambdas reach
# S3 through the free gateway endpoint and nothing else; they hand mail
# work to the non-VPC email relay through the outbox bucket. Secrets arrive via
# CloudFormation dynamic references from the app secret (created by
# bootstrap); CR API tokens exist only on gateway operator machines.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding Lambda bundles (created by bootstrap)
  WebApiCodeKey:
    Type: String
  McpCodeKey:
    Type: String
  SchedulerCodeKey:
    Type: String
  EmailRelayCodeKey:
    Type: String
  MigrateCodeKey:
    Type: String
  JobsCodeKey:
    Type: String
  CollectorCodeKey:
    Type: String
  TimelineSyncCodeKey:
    Type: String
  AppSecretName:
    Type: String
    Default: elixir-mcp/app
    Description: Secrets Manager secret with db_password, session_secret, buttondown_api_token, clan_sealing_secret when ClanInternal is true, and optionally unsubscribe_secret and session_secret_previous (URL-safe values; docs/SECRETS.md)
  SiteCertificateArn:
    Type: String
    Default: ""
    Description: ACM cert for elixir.poapkings.com (us-east-1); empty deploys without the alias
  SchedulerTickMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 60
    Description: Planner tick cadence; tune with a parameter-only stack update, no code change
  CollectorMinEnforce:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Refuse lease and submit to a collector below min_client_version. Config is never refused, since it is the channel a stale client updates through. Flip only when every collector reports a version at or above the minimum.
  DbSnapshotIdentifier:
    Type: String
    Default: ""
    Description: >-
      Set ONCE (2026-09-06 encryption migration) to restore the instance
      from an encrypted snapshot; PRESERVED thereafter. Changing it
      REPLACES the database - never let it reset to default.
  OriginSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Shared secret CloudFront attaches to every origin request as the
      x-elixir-origin header; both API Lambdas refuse requests without it,
      so a direct execute-api hit cannot forge the viewer headers the doors
      record. Generated by deploy.mjs on its first deploy and PRESERVED.
      Rotated by deploy.mjs --rotate-origin-secret (docs/SECRETS.md).
  OriginSecretPrevious:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      The origin secret a rotation replaced. The doors accept it beside
      OriginSecret while CloudFront edges move to the new value; cleared
      with --param=OriginSecretPrevious= once the rotation has settled.
      Set by deploy.mjs --rotate-origin-secret, PRESERVED otherwise.
  SessionSecretPreviousInSecret:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to true while the app secret carries session_secret_previous
      (the session secret a rotation replaced); the doors then verify
      sessions signed with it, so a rotation signs nobody out. Back to
      false, and deployed, before that key is removed (docs/SECRETS.md).
  UnsubscribeKeyInSecret:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to true once the app secret carries unsubscribe_secret; mail
      then signs unsubscribe links with it instead of the session secret
      (docs/SECRETS.md).
  SecretEpoch:
    Type: String
    Default: "0"
    Description: >-
      Change it (to the date, say) to make every function re-resolve its
      Secrets Manager references on the next deploy: CloudFormation reads
      a secret again only when the resource holding the reference changes
      (docs/SECRETS.md).
  ClanInternal:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable integrated Clan features; disabling does not restore a separate runtime

Conditions:
  HasInternalClan: !Equals [!Ref ClanInternal, "true"]
  HasSiteCert: !Not [!Equals [!Ref SiteCertificateArn, ""]]
  HasDbSnapshot: !Not [!Equals [!Ref DbSnapshotIdentifier, ""]]
  HasOriginSecret: !Not [!Equals [!Ref OriginSecret, ""]]
  HasOriginSecretPrevious: !Not [!Equals [!Ref OriginSecretPrevious, ""]]
  HasSessionSecretPrevious: !Equals [!Ref SessionSecretPreviousInSecret, "true"]
  HasUnsubscribeKey: !Equals [!Ref UnsubscribeKeyInSecret, "true"]
  TickIsOneMinute: !Equals [!Ref SchedulerTickMinutes, 1]

Resources:
  # ------------------------------------------------------------ networking
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: elixir-mcp }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/26
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: elixir-mcp-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.64/26
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: elixir-mcp-private-b }]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: elixir-mcp VPC Lambdas
      VpcId: !Ref Vpc

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: elixir-mcp RDS; Postgres from Lambdas only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # S3 reachability for the VPC Lambdas (payload archive). A Gateway
  # endpoint is free; it needs an explicit route table, so the private
  # subnets move off the VPC main table (local route is implicit).
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: elixir-mcp-private }]

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # -------------------------------------------------------------- database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: elixir-mcp private subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: DbPostgresLogGroup
    Properties:
      # Renamed at the 2026-09-06 encryption migration: restoring from
      # the encrypted snapshot is a REPLACEMENT, and the retained old
      # instance still holds the original identifier.
      DBInstanceIdentifier: elixir-mcp-enc
      Engine: postgres
      EngineVersion: "17"
      # db.t4g.micro again from 2026-10-08, the class the reserved
      # instance (to 2027-09-07) covers in full. The small (2026-09-23 to
      # 10-08) was for a record the tracked-only correction has since
      # removed: after it and a VACUUM FULL of the three battle tables
      # the database is about 2 GB, with CPU near 5% and reads in KB/s.
      # The micro's limit is EBS throughput (about 4.7 MB/s once the byte
      # balance is spent, as the Gym sweep did on 2026-09-23), so space
      # heavy sweeps and backfills. docs/NOTES.md 2026-10-08.
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      MaxAllocatedStorage: 100
      StorageType: gp3
      DBSnapshotIdentifier:
        !If [HasDbSnapshot, !Ref DbSnapshotIdentifier, !Ref AWS::NoValue]
      # Snapshot restores take name/encryption from the snapshot itself.
      DBName: !If [HasDbSnapshot, !Ref AWS::NoValue, elixir_mcp]
      StorageEncrypted: !If [HasDbSnapshot, !Ref AWS::NoValue, true]
      MasterUsername: !If [HasDbSnapshot, !Ref AWS::NoValue, elixir]
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      # Enhanced Monitoring at one minute:
      # the two memory recoveries that day were invisible from the
      # instance metrics alone - FreeableMemory and SwapUsage say the box
      # is squeezed, not by whom. This is the OS-level split (Postgres vs
      # page cache vs RDS agent) the instance-class decision waits on.
      # About $0.50/month of CloudWatch Logs.
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DbMonitoringRole.Arn
      # The statement side of a stall (2026-09-12). Enhanced Monitoring
      # says the box is squeezed; the Postgres log says by WHICH query,
      # and whether it was waiting on a lock. Exported to CloudWatch so
      # it survives the instance and can be queried beside the Lambda
      # lines. The custom parameter group only takes effect after one
      # manual reboot (a group swap is applied at reboot even when every
      # parameter in it is dynamic) - docs/NOTES.md 2026-09-12.
      DBParameterGroupName: !Ref DbParameterGroup
      EnableCloudwatchLogsExports: [postgresql]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: elixir-mcp postgres17 - slow statements and lock waits to the log
      Parameters:
        # One second: at this volume the whole log is a few lines an hour
        # in steady state and every line is one worth reading.
        log_min_duration_statement: 1000
        log_lock_waits: 1
        # Autovacuum runs over one second are the other thing that eats
        # a micro's memory and I/O without any request naming it.
        log_autovacuum_min_duration: 1000
        # shared_buffers is the engine default (a quarter of memory). The
        # 88 MB pin (11264 pages, 2026-09-12) was the old micro's squeeze
        # under a record five times today's size; it was not restored
        # with the micro on 2026-10-08.

  # Declared so retention is set before RDS starts writing; left to RDS
  # the group is created with never-expire.
  DbPostgresLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/rds/instance/elixir-mcp-enc/postgresql
      RetentionInDays: 14

  DbMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-rds-monitoring
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: monitoring.rds.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  # ---------------------------------------------------------------- queues
  EmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-email
      # Lambda's SQS guidance is at least six times the 60-second
      # consumer timeout, so a still-running send is never redelivered.
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailDlq.Arn
        maxReceiveCount: 5

  EmailDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-email-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # The timeline cross-posted to Discord (2026-10-10). An admission that
  # wrote new facts wakes each account that syndicates its subject: a
  # timeline-sync/ object, one per account a minute, held a minute
  # (DelaySeconds) so a burst of admissions is one sync. The sync is a
  # VPC Lambda; its event source mapping needs no route to SQS.
  TimelineSyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-timeline-sync
      DelaySeconds: 60
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TimelineSyncDlq.Arn
        maxReceiveCount: 5

  TimelineSyncDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-timeline-sync-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # The sync's lines, to the relay (which also sends the mail): a queue
  # of their own, so a busy timeline never holds up a sign-in email.
  TimelineDiscordQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-timeline-discord
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TimelineDiscordDlq.Arn
        maxReceiveCount: 5

  TimelineDiscordDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: elixir-mcp-timeline-discord-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ------------------------------------------------------------------- iam
  # One role per function (#24). These five used to share
  # elixir-mcp-vpc-lambda, so the two internet-facing Lambdas carried
  # the union of everything any of them needed - including archive
  # Get/Put/List that only three of them use at all. Each role below
  # grants exactly what its function's code reaches for, verified
  # against the ARCHIVE_BUCKET / OUTBOX_BUCKET environment each one
  # actually receives.
  #
  # The shared PostgreSQL credential is NOT split here. Doing that
  # properly means separate database roles with migration-managed
  # GRANT/REVOKE, which is a larger and riskier change than an IAM
  # rewrite and wants its own pass.

  # Public web: mails through the outbox, counts what is stuck there for
  # the status page, and, until the collector routes leave it (they moved
  # to CollectorFunction on 2026-09-29), archives collector submissions.
  WebApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-web-api
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-web-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Mail leaves through the outbox; the status page counts
              # what is stuck there.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/email/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
              # No payloads/: the collector door, the one writer there,
              # has its own Lambda and role since 2026-09-29.
              # Captured tool calls: the
              # console's call record reads one body at a time through
              # the session check. Read only; the MCP door writes them.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - ${Arn}/calls/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              # Sent product mail (0139): the console's email record
              # reads one body at a time; the account page's "send me
              # this now" composes in-process and archives its own send.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub
                  - ${Arn}/mail/sent/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArchiveBucket.Arn
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/request/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/reply/*
                - !Ref AWS::NoValue
              # Actions in a clan's Discord (2026-10-10): posts and edits
              # go to the relay the same way, and their answers come back.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/request/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/reply/*
                - !Ref AWS::NoValue
              # The timeline to Discord (2026-10-10): a save's hello line
              # to the relay, and the relay's last word on the webhook,
              # whose absence is confirmed with an exact-key list.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord-state/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - timeline-discord-state/*
                    NumericLessThanEquals:
                      s3:max-keys: "1"
                - !Ref AWS::NoValue
              # A leader's attested fact (a departure classified, an
              # award) wakes the clan's activity sync (2026-10-10).
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-sync/*
              # A battle's public page (2026-10-01): the app shell it is
              # served in, and the card art its share picture draws,
              # read from the site bucket. Read only; the site is
              # published by the deploy, never here.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::elixir-mcp-site-${AWS::AccountId}/app.html
                  - !Sub arn:aws:s3:::elixir-mcp-site-${AWS::AccountId}/assets/cards/*
                  # The site's 404 page, answered for an address the
                  # bucket misses (SiteDistribution's site-or-miss group).
                  - !Sub arn:aws:s3:::elixir-mcp-site-${AWS::AccountId}/404.html

  # The collector door (services/collector): archives each submission at
  # admission, write-once (ArchiveBucketPolicy; a put with If-None-Match
  # needs s3:PutObject alone, per the S3 guide), and mails the owner when
  # a collector is quarantined. No read, no listing, no other prefix.
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-collector
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-collector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - ${Arn}/payloads/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/email/*
              # An admission that wrote new facts wakes the timeline sync
              # of each account that cross-posts its subject (2026-10-10).
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-sync/*

  # The MCP/OAuth door sends login mail and, since 0063, writes the
  # request/response of every tool call under calls/ (nothing else on
  # the bucket: the payload archive is the collector door's).
  McpRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-mcp
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-mcp
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/email/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - ${Arn}/calls/*
                  - Arn: !GetAtt ArchiveBucket.Arn

  # The tick only touches Postgres and stdout (ledger health rides EMF,
  # not the CloudWatch API). No queues, no bucket.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  # Migrations plus the archive export/verify ops, which READ payloads/:
  # the collector door is the archive's only writer (review 2026-09-27
  # §2.7 dropped an s3:PutObject nothing used).
  MigrateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-migrate
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-migrate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - ${Arn}/payloads/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - ${Arn}/clan-migration/v1/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              # Private census artifacts only; no payload or archive deletion.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub
                  - ${Arn}/right-sizing/v1/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              # The call captures, READ only (3.18.0): the refusal and
              # controls censuses read request and response bodies the
              # MCP door wrote; nothing here writes a capture.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - ${Arn}/calls/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArchiveBucket.Arn

  # The weekly sweep HEAD-verifies an S3 twin before deleting the
  # Postgres row. HeadObject is authorized by s3:GetObject - READ only,
  # deliberately: the job that deletes the database copy must not be
  # able to write or overwrite the copy it is checking against.
  JobsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-jobs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - ${Arn}/payloads/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArchiveBucket.Arn
              # Product email (docs/EMAIL.md): the jobs Lambda composes
              # and hands it to the outbox; the relay sends. Sent message bodies remain archived under mail/.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub
                  - ${Arn}/mail/*
                  - Arn: !GetAtt ArchiveBucket.Arn
              # The VPC reaches nothing but S3, so mail's
              # messages leave through the outbox.
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/email/*
              # The morning run's Actions in a clan's Discord (2026-10-10):
              # posts and edits to the relay, and their answers back. A
              # missing answer is confirmed with an exact-key, one-result
              # list, as the relay does.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/request/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/reply/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - clan-discord/reply/*
                    NumericLessThanEquals:
                      s3:max-keys: "1"
                - !Ref AWS::NoValue
              # Card art in mail (2026-10-08): whether the site's
              # mirror holds an Evo or Hero image, so a form Supercell
              # has not published yet draws the base card. Read only
              # (a HEAD is s3:GetObject); the site is published by the
              # deploy, never here.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::elixir-mcp-site-${AWS::AccountId}/assets/cards/*

  # The timeline sync (services/timeline-sync, 2026-10-10): reads its
  # wakes, reads the database, writes the lines for the relay and, when
  # the timeline's cap held some back, a wake for itself; reads the
  # relay's last word on the webhook. The webhook it copies is sealed:
  # it holds no key to open it.
  TimelineSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-timeline-sync
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: elixir-mcp-timeline-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  [
                    sqs:ReceiveMessage,
                    sqs:DeleteMessage,
                    sqs:GetQueueAttributes,
                    sqs:GetQueueUrl,
                  ]
                Resource: !GetAtt TimelineSyncQueue.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-sync/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord-state/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
                Condition:
                  StringLike:
                    s3:prefix:
                      - timeline-discord-state/*
                  NumericLessThanEquals:
                    s3:max-keys: "1"
              # A clan's activity in its Discord (2026-10-10): with the
              # rewrite on, the clan's own model is asked through the
              # relay as Clan asks it (packages/clan/src/model-bridge.mjs),
              # and a missing reply is confirmed with an exact-key list.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/request/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/reply/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - clan-model/reply/*
                    NumericLessThanEquals:
                      s3:max-keys: "1"
                - !Ref AWS::NoValue

  # The email outbox connects VPC composers to the non-VPC relay.
  OutboxBucket:
    Type: AWS::S3::Bucket
    DependsOn: OutboxQueuePolicy
    Properties:
      BucketName: !Sub elixir-mcp-outbox-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-with-the-dlq
            Status: Enabled
            ExpirationInDays: 14
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EmailQueue.Arn
            Filter:
              S3Key: { Rules: [{ Name: prefix, Value: email/ }] }
          - !If
            - HasInternalClan
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt EmailQueue.Arn
              Filter:
                S3Key: { Rules: [{ Name: prefix, Value: clan-model/request/ }] }
            - !Ref AWS::NoValue
          - !If
            - HasInternalClan
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt EmailQueue.Arn
              Filter:
                S3Key:
                  { Rules: [{ Name: prefix, Value: clan-discord/request/ }] }
            - !Ref AWS::NoValue
          # The timeline to Discord (2026-10-10): a wake for the sync, and
          # the sync's lines for the relay.
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt TimelineSyncQueue.Arn
            Filter:
              S3Key: { Rules: [{ Name: prefix, Value: timeline-sync/ }] }
          - !If
            - HasInternalClan
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt TimelineDiscordQueue.Arn
              Filter:
                S3Key: { Rules: [{ Name: prefix, Value: timeline-discord/ }] }
            - !Ref AWS::NoValue

  # S3 may notify the lanes' queues, and only from the outbox. The
  # bucket ARN is spelled out rather than referenced so the bucket can
  # depend on this policy (S3 checks it can deliver when the notification
  # is configured).
  OutboxQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        [!Ref EmailQueue, !Ref TimelineSyncQueue, !Ref TimelineDiscordQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource:
              - !GetAtt EmailQueue.Arn
              - !GetAtt TimelineSyncQueue.Arn
              - !GetAtt TimelineDiscordQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmailRelayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-mcp-email-relay
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: elixir-mcp-email-relay
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  [
                    sqs:ReceiveMessage,
                    sqs:DeleteMessage,
                    sqs:GetQueueAttributes,
                    sqs:GetQueueUrl,
                  ]
                Resource:
                  - !GetAtt EmailQueue.Arn
                  - !GetAtt TimelineDiscordQueue.Arn
              # Its lane of the outbox: read the message, delete it once sent.
              - Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/email/*
              # Missing-key GETs can return 403. The adapter confirms absence
              # with an exact-key, one-result list inside these two prefixes.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - clan-model/reply/*
                        - clan-model/claim/*
                        - clan-discord/reply/*
                        - clan-discord/claim/*
                        - timeline-discord-state/*
                    NumericLessThanEquals:
                      s3:max-keys: "1"
                - !Ref AWS::NoValue
              # Durable transport receipts for one notice per upgrade.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/mail-delivery/collector-upgrade/*
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource:
                    - !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/claim/*
                    - !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-model/reply/*
                - !Ref AWS::NoValue
              # Actions in a clan's Discord (2026-10-10): the same lane.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: s3:PutObject
                  Resource:
                    - !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/claim/*
                    - !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/clan-discord/reply/*
                - !Ref AWS::NoValue
              # The timeline to Discord (2026-10-10): its lines, read and
              # deleted once delivered, and the relay's own records of
              # each post's message id and the account's last delivery.
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: [s3:GetObject, s3:DeleteObject]
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord/*
                - !Ref AWS::NoValue
              - !If
                - HasInternalClan
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                  Resource: !Sub arn:aws:s3:::elixir-mcp-outbox-${AWS::AccountId}/timeline-discord-state/*
                - !Ref AWS::NoValue
              # Send as elixir@poapkings.com and nothing else: the identity
              # and the configuration set are the only resources, and the
              # From address is pinned by condition. SES authorizes a send
              # against the ADDRESS identity ARN even when only the domain
              # is verified (first send, 2026-09-17: AccessDenied on
              # identity/elixir@poapkings.com), so both spellings are here.
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/poapkings.com
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/elixir@poapkings.com
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/elixir-mcp
                Condition:
                  StringEquals:
                    ses:FromAddress: elixir@poapkings.com

  # ----------------------------------------------------------------- email
  # Sending as elixir@poapkings.com through SES (2026-09-16; Fastmail is a
  # mailbox, not a sender, and RECEIVING stays there - nothing here touches
  # the apex MX). Easy DKIM signs with SES-managed keys: the three CNAMEs
  # in Outputs go to Namecheap by hand. bounce.poapkings.com is the custom
  # MAIL FROM so SPF aligns with the From domain (Gmail/Yahoo bulk rules);
  # it needs the MX and TXT in Outputs. Bounces and complaints go to the
  # alarm topic, so they reach the ops queue like everything else; open
  # and click are NOT in the event list, which is what keeps the mail
  # pixel-free and the links unwrapped. Forwarding bounce notifications to
  # the From mailbox is off for the same reason: the queue is the record.
  SenderConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: elixir-mcp
      SendingOptions: { SendingEnabled: true }
      ReputationOptions: { ReputationMetricsEnabled: true }
      SuppressionOptions: { SuppressedReasons: [BOUNCE, COMPLAINT] }

  SenderEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SenderConfigurationSet
      EventDestination:
        Name: ops-alerts
        Enabled: true
        MatchingEventTypes:
          [BOUNCE, COMPLAINT, REJECT, RENDERING_FAILURE, DELIVERY_DELAY]
        SnsDestination: { TopicARN: !Ref AlarmTopic }

  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: poapkings.com
      DkimAttributes: { SigningEnabled: true }
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }
      MailFromAttributes:
        MailFromDomain: bounce.poapkings.com
        BehaviorOnMxFailure: USE_DEFAULT_VALUE
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref SenderConfigurationSet
      FeedbackAttributes: { EmailForwardingEnabled: false }

  # --------------------------------------------------------------- lambdas
  WebApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-web-api
      RetentionInDays: 30

  WebApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: WebApiLogGroup
    Properties:
      FunctionName: elixir-mcp-web-api
      # A ceiling, not a target (#23). Each invocation opens its own
      # PostgreSQL client against a db.t4g.micro, so unbounded Lambda
      # concurrency makes the DATABASE the thing that fails first.
      # Measured traffic is a handful of requests a minute; 20 is orders
      # of magnitude above that and still a hard stop on a runaway
      # client or a bill.
      ReservedConcurrentExecutions: 20
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: !If [HasInternalClan, 30, 20]
      Role: !GetAtt WebApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref WebApiCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          # verify-full against the RDS root CAs bundled with the code
          # (infra/certificates; build.mjs copies them into each DB
          # function's package). Was no-verify: encrypted, but any server
          # could answer (#71).
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          # Every backend is named and bounded:
          # node-pg reads PGAPPNAME and PGOPTIONS at connect. The
          # statement_timeout is a ceiling just under the Lambda kill, so a
          # statement the Lambda abandons is cancelled rather than orphaned
          # (0099 on 2026-09-15; two 42 and 57 minute `pop` backends on
          # 2026-09-18); the invoker's per-call budget sets its own below
          # it. idle_in_transaction_session_timeout releases the locks of a
          # transaction whose Lambda is gone. The migrate ops name
          # themselves `elixir-mcp-migrate:<op>`.
          PGAPPNAME: elixir-mcp-web-api
          # statement_timeout: just under the 20 s Lambda kill.
          PGOPTIONS: "-c statement_timeout=18s -c idle_in_transaction_session_timeout=60s"
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret}}"
          SESSION_SECRET_PREVIOUS: !If
            - HasSessionSecretPrevious
            - !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret_previous}}"
            - !Ref AWS::NoValue
          UNSUBSCRIBE_SECRET: !If
            - HasUnsubscribeKey
            - !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:unsubscribe_secret}}"
            - !Ref AWS::NoValue
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          OUTBOX_BUCKET: !Ref OutboxBucket
          # The app shell a battle's page is served in (routes/battle.mjs).
          SITE_BUCKET: !Sub elixir-mcp-site-${AWS::AccountId}
          ORIGIN_SECRET: !Ref OriginSecret
          ORIGIN_SECRET_PREVIOUS: !If
            - HasOriginSecretPrevious
            - !Ref OriginSecretPrevious
            - !Ref AWS::NoValue
          OWNER_NOTIFY_EMAIL: jamie@thingelstad.com
          CLAN_INTERNAL: !Ref ClanInternal
          CLAN_MODEL_SECRET:
            !If [
              HasInternalClan,
              !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:clan_sealing_secret}}",
              !Ref AWS::NoValue,
            ]

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-collector
      RetentionInDays: 30

  # The collector door (services/collector), on a function of its own
  # since 2026-09-29: it was 99% of the web-api's requests, so a fleet
  # burst took the console's concurrency. The site API routes
  # /api/collector/* here (CollectorRoute).
  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: elixir-mcp-collector
      # The fleet's own ceiling, apart from the console's (#23: each
      # invocation is a PostgreSQL client). Measured over the three days
      # to 2026-09-29: at most 402 requests a minute, lease p95 61 ms,
      # submit p95 388 ms, so a handful in flight. Ten is room for a
      # burst and a hard stop on a runaway fleet.
      ReservedConcurrentExecutions: 10
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 20
      Role: !GetAtt CollectorRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CollectorCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-collector
          # statement_timeout: just under the 20 s Lambda kill.
          PGOPTIONS: "-c statement_timeout=18s -c idle_in_transaction_session_timeout=60s"
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          OUTBOX_BUCKET: !Ref OutboxBucket
          COLLECTOR_MIN_ENFORCE: !Ref CollectorMinEnforce
          ORIGIN_SECRET: !Ref OriginSecret
          ORIGIN_SECRET_PREVIOUS: !If
            - HasOriginSecretPrevious
            - !Ref OriginSecretPrevious
            - !Ref AWS::NoValue
          OWNER_NOTIFY_EMAIL: jamie@thingelstad.com

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-mcp
      RetentionInDays: 30

  McpFunction:
    Type: AWS::Lambda::Function
    DependsOn: McpLogGroup
    Properties:
      FunctionName: elixir-mcp-mcp
      # Same reasoning as the web API: bound the database, not just the
      # function (#23).
      ReservedConcurrentExecutions: 20
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 25
      Role: !GetAtt McpRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref McpCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-mcp
          # statement_timeout: just under the 25 s Lambda kill.
          PGOPTIONS: "-c statement_timeout=23s -c idle_in_transaction_session_timeout=60s"
          OAUTH_ISSUER: https://elixir.poapkings.com
          OUTBOX_BUCKET: !Ref OutboxBucket
          ORIGIN_SECRET: !Ref OriginSecret
          ORIGIN_SECRET_PREVIOUS: !If
            - HasOriginSecretPrevious
            - !Ref OriginSecretPrevious
            - !Ref AWS::NoValue
          # Call capture is on when this is set (packages/tools/src/capture.mjs).
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          # The Status page's "work waiting" gauge re-runs the scheduler's
          # eligibility query, so it must know the tick cadence.
          SCHEDULER_TICK_MINUTES: !Ref SchedulerTickMinutes
          OWNER_NOTIFY_EMAIL: jamie@thingelstad.com
          # Consent honours the site session and mints one (0083). Same
          # secret as the site API, so a cookie either origin set resolves
          # at the other.
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret}}"
          SESSION_SECRET_PREVIOUS: !If
            - HasSessionSecretPrevious
            - !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret_previous}}"
            - !Ref AWS::NoValue

  SchedulerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-scheduler
      RetentionInDays: 30

  SchedulerFunction:
    Type: AWS::Lambda::Function
    DependsOn: SchedulerLogGroup
    Properties:
      FunctionName: elixir-mcp-scheduler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 50
      ReservedConcurrentExecutions: 1
      Role: !GetAtt SchedulerRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref SchedulerCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-scheduler
          # statement_timeout: under the 50 s Lambda kill.
          PGOPTIONS: "-c statement_timeout=45s -c idle_in_transaction_session_timeout=60s"

  SchedulerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-scheduler-tick
      # EventBridge insists on the singular unit for exactly 1.
      ScheduleExpression: !If
        - TickIsOneMinute
        - rate(1 minute)
        - !Sub rate(${SchedulerTickMinutes} minutes)
      State: ENABLED
      Targets:
        - Id: scheduler
          Arn: !GetAtt SchedulerFunction.Arn

  SchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SchedulerRule.Arn

  EmailRelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-email-relay
      RetentionInDays: 30

  EmailRelayFunction:
    Type: AWS::Lambda::Function
    DependsOn: EmailRelayLogGroup
    Properties:
      FunctionName: elixir-mcp-email-relay
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt EmailRelayRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref EmailRelayCodeKey }
      Environment:
        Variables:
          FROM_EMAIL: elixir@poapkings.com
          SES_CONFIGURATION_SET: !Ref SenderConfigurationSet
          BUTTONDOWN_API_TOKEN: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:buttondown_api_token}}"
          SECRET_EPOCH: !Ref SecretEpoch
          OUTBOX_BUCKET: !Ref OutboxBucket
          CLAN_MODEL_SECRET:
            !If [
              HasInternalClan,
              !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:clan_sealing_secret}}",
              !Ref AWS::NoValue,
            ]

  EmailEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref EmailRelayFunction
      EventSourceArn: !GetAtt EmailQueue.Arn
      BatchSize: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  # The timeline's lines (2026-10-10): one object a run, at most two runs
  # at once, so a webhook is posted to at Discord's pace.
  TimelineDiscordEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref EmailRelayFunction
      EventSourceArn: !GetAtt TimelineDiscordQueue.Arn
      BatchSize: 1
      ScalingConfig: { MaximumConcurrency: 2 }
      FunctionResponseTypes: [ReportBatchItemFailures]

  # The timeline sync (2026-10-10): one account's timeline brought up to
  # date in its Discord channel, woken by the collector door's admissions.
  TimelineSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-timeline-sync
      RetentionInDays: 30

  TimelineSyncFunction:
    Type: AWS::Lambda::Function
    DependsOn: TimelineSyncLogGroup
    Properties:
      FunctionName: elixir-mcp-timeline-sync
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt TimelineSyncRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref TimelineSyncCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-timeline-sync
          PGOPTIONS: "-c statement_timeout=50s -c idle_in_transaction_session_timeout=60s"
          OUTBOX_BUCKET: !Ref OutboxBucket
          # Seals a clan's rewrite request and opens its reply; the
          # clan's key and the webhook stay sealed here.
          CLAN_MODEL_SECRET:
            !If [
              HasInternalClan,
              !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:clan_sealing_secret}}",
              !Ref AWS::NoValue,
            ]

  # Two at once: wakes for different accounts run side by side, and the
  # sync's row lock keeps one account to one at a time.
  TimelineSyncEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref TimelineSyncFunction
      EventSourceArn: !GetAtt TimelineSyncQueue.Arn
      BatchSize: 10
      ScalingConfig: { MaximumConcurrency: 2 }
      FunctionResponseTypes: [ReportBatchItemFailures]

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-migrate
      RetentionInDays: 30

  MigrateFunction:
    Type: AWS::Lambda::Function
    DependsOn: MigrateLogGroup
    Properties:
      FunctionName: elixir-mcp-migrate
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt MigrateRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref MigrateCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-migrate
          CLAN_INTERNAL: !Ref ClanInternal
          # statement_timeout: under the 300 s Lambda kill. The ops that
          # set their own (120 s, 250 s) set it lower.
          PGOPTIONS: "-c statement_timeout=285s -c idle_in_transaction_session_timeout=60s"
          ARCHIVE_BUCKET: !Ref ArchiveBucket

  # Scheduled product jobs: the timer-driven work —
  # clan pulse, weekly sweeps — runs in its own Lambda so the
  # schema-capable migrate function never fires on a schedule.
  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-mcp-jobs
      RetentionInDays: 30

  JobsFunction:
    Type: AWS::Lambda::Function
    DependsOn: JobsLogGroup
    Properties:
      FunctionName: elixir-mcp-jobs
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 1024
      # 900 since 0121: a full-month season rollup is minutes on the
      # micro, and the nightly job may fill one past season after the
      # running one. Reserved concurrency 1 keeps runs from overlapping.
      Timeout: 900
      ReservedConcurrentExecutions: 1
      Role: !GetAtt JobsRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref JobsCodeKey }
      VpcConfig:
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgres://elixir:{{resolve:secretsmanager:${AppSecretName}:SecretString:db_password}}@${Database.Endpoint.Address}:5432/elixir_mcp?sslmode=verify-full"
          NODE_EXTRA_CA_CERTS: /var/task/certificates/rds.pem
          SECRET_EPOCH: !Ref SecretEpoch
          PGAPPNAME: elixir-mcp-jobs
          # statement_timeout: a per-statement bound, not the 900 s run.
          # The longest statement the jobs log shows over 29 days is the
          # nightly rollup's cards aggregate, 108 s on 2026-09-22 (the
          # retired one-statement `pop` was 228 s on 2026-09-19).
          PGOPTIONS: "-c statement_timeout=300s -c idle_in_transaction_session_timeout=60s"
          ARCHIVE_BUCKET: !Ref ArchiveBucket
          # The card-art mirror mail asks about (cardArtHeld).
          SITE_BUCKET: !Sub elixir-mcp-site-${AWS::AccountId}
          # Product email (docs/EMAIL.md): the queue the relay drains, the
          # secret the one-click unsubscribe token is signed with (the same
          # one the web API verifies it with).
          OUTBOX_BUCKET: !Ref OutboxBucket
          CLAN_INTERNAL: !Ref ClanInternal
          # Seals a clan's Discord webhook into the morning run's posts.
          CLAN_MODEL_SECRET:
            !If [
              HasInternalClan,
              !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:clan_sealing_secret}}",
              !Ref AWS::NoValue,
            ]
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret}}"
          UNSUBSCRIBE_SECRET: !If
            - HasUnsubscribeKey
            - !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:unsubscribe_secret}}"
            - !Ref AWS::NoValue
          OWNER_NOTIFY_EMAIL: jamie@thingelstad.com

  # The async retries of every scheduled job, stated rather than left to
  # the defaults (six hours, two retries). A mail run that stops short of
  # its recipients fails on purpose, and a retry carries on from where
  # the ledger says it stopped; an event
  # an hour old has been superseded by the next hourly run, and a weekly
  # mail run gets three invocations inside that hour.
  JobsInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref JobsFunction
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 3600
      MaximumRetryAttempts: 2

  ClanEvaluateRule:
    Type: AWS::Events::Rule
    Condition: HasInternalClan
    Properties:
      Name: elixir-mcp-clan-evaluate
      ScheduleExpression: cron(0/2 11 * * ? *)
      State: ENABLED
      Targets:
        - Id: clan-evaluate
          Arn: !GetAtt JobsFunction.Arn
          Input: '{"clan_evaluate":true}'
  ClanEvaluatePermission:
    Type: AWS::Lambda::Permission
    Condition: HasInternalClan
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ClanEvaluateRule.Arn

  EmailClanReportRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-email-clan-report
      ScheduleExpression: cron(0 14 ? * MON *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: email-clan-report
          Input: '{"email": "clan_report"}'
  EmailClanReportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailClanReportRule.Arn
  EmailArenaWeekRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-email-arena-week
      ScheduleExpression: cron(0 14 ? * TUE *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: email-arena-week
          Input: '{"email": "arena_week"}'
  EmailArenaWeekPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailArenaWeekRule.Arn
  EmailTrackingReportRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-email-tracking-report
      ScheduleExpression: cron(0 14 ? * WED *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: email-tracking-report
          Input: '{"email": "tracking_report"}'
  EmailTrackingReportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailTrackingReportRule.Arn
  EmailCollectorActivityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-email-collector-activity
      ScheduleExpression: cron(0 14 ? * SUN *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: email-collector-activity
          Input: '{"email": "collector_activity"}'
  EmailCollectorActivityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailCollectorActivityRule.Arn
  # The minute's mail drains: collector upgrades, and (0204) an answer to
  # a person's feedback, once it has settled ten minutes unread. One event
  # runs both, collector upgrades first.
  CollectorUpgradeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-collector-upgrade-mail
      ScheduleExpression: rate(1 minute)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: collector-upgrade-mail
          Input: '{"collector_upgrades": true, "feedback_answers": true}'
  CollectorUpgradePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CollectorUpgradeRule.Arn
  EmailMilestoneRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-email-milestone
      ScheduleExpression: cron(20 * * * ? *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: email-milestone
          Input: '{"email": "milestone"}'
  EmailMilestonePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EmailMilestoneRule.Arn

  # Hourly Postgres payload sweep: superseded
  # payload rows leave Postgres once their S3 twin is HEAD-verified, and
  # the JSON of rows not fetched for two hours is nulled the same way
  # (0071/0072: the column is a cache of the archive; the recorder
  # refetches most entities daily, so a daily sweep kept nearly all of
  # it resident). Hourly since 2026-09-11; was weekly.
  PayloadSweepRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-payload-sweep
      ScheduleExpression: cron(15 * * * ? *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: payload-sweep
          Input: '{"sweep_payloads": true, "sweep_operational": true}'

  PayloadSweepPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PayloadSweepRule.Arn

  # Nightly battle-activity histogram (0084): one row per recorded player,
  # a decayed 24x7 rhythm and a year of UTC daily counts, rebuilt from
  # battle_participant. 05:30Z is the fleet's quietest hour (2026-09-13
  # read: 91-100 battlelog fetches/hr at 06-09Z against 150 in the US
  # evening) and after the UTC day has closed, so yesterday's count is
  # final. Read by the console today and by the scheduler later.
  ActivityHistogramRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-activity-histogram
      ScheduleExpression: cron(30 5 * * ? *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: activity-histogram
          Input: '{"activity_histogram": true}'

  ActivityHistogramPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ActivityHistogramRule.Arn

  # What the battlelog schedule costs and loses, per UTC day (0145;
  # Jamie, 2026-09-19): the last three closed days rewritten at 05:20Z,
  # after the payload sweep and before the histogram; the console's
  # Efficiency page reads the table.
  CaptureEfficiencyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-capture-efficiency
      ScheduleExpression: cron(20 5 * * ? *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: capture-efficiency
          Input: '{"capture_efficiency": true}'

  CaptureEfficiencyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CaptureEfficiencyRule.Arn

  # The nightly payload shape census (0132):
  # twenty archived objects per endpoint from the last day against the
  # field manifest; findings filed into feedback (surface recorder), the
  # PayloadShapeFindings metric emitted. 05:05Z: before the 05:30Z histogram, the UTC day closed.
  ShapeCensusRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elixir-mcp-shape-census
      ScheduleExpression: cron(5 5 * * ? *)
      Targets:
        - Arn: !GetAtt JobsFunction.Arn
          Id: shape-census
          Input: '{"shape_census": true}'

  ShapeCensusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JobsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ShapeCensusRule.Arn

  # ------------------------------------------------------------ front doors
  SiteApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: elixir-mcp-site-api
      ProtocolType: HTTP
      Target: !GetAtt WebApiFunction.Arn

  SiteApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SiteApi}/*

  # The collector door's route. The quick-create API's $default route
  # still sends everything else to the web-api: a route with a path is
  # matched before $default, and the $default stage auto-deploys it. The
  # same API, so the same CloudFront behaviour, origin secret and
  # forwarded collector headers, and the stage's default route throttle
  # (api-throttle-config.mjs) covers it as every route. The route waits
  # for the permission, so the first request it takes can invoke.
  CollectorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SiteApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CollectorFunction.Arn
      PayloadFormatVersion: "2.0"

  CollectorRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn: CollectorApiPermission
    Properties:
      ApiId: !Ref SiteApi
      RouteKey: ANY /api/collector/{proxy+}
      Target: !Sub integrations/${CollectorIntegration}

  CollectorApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SiteApi}/*

  McpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: elixir-mcp-mcp-api
      ProtocolType: HTTP
      Target: !GetAtt McpFunction.Arn

  McpApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApi}/*

  # The payload archive: every admitted payload's raw bytes,
  # Hive-partitioned, content-addressed. S3 is the system of record for
  # raw observations; Postgres keeps the hot set.
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub elixir-mcp-archive-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Encryption stated rather than inherited from the account default.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      # This bucket is the system of record: canonical projections are
      # rebuilt FROM it. Without versioning a PutObject over a known key
      # is silent and unrecoverable - and PutObject is exactly what the
      # internet-facing ingest path holds (#24). Deleting still needs
      # s3:DeleteObject, which nothing is granted.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: payloads-to-ia
            Status: Enabled
            Prefix: payloads/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          # Captured tool calls follow the call log's own rule: the
          # arguments leave the audit row after 90 days, so the bodies
          # do too (docs/limits retention table). The housekeeping job
          # flips mcp_call_audit.captured on the same clock.
          - Id: calls-expire
            Status: Enabled
            Prefix: calls/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            ExpirationInDays: 90
          # On this versioned bucket, calls-expire only writes a delete
          # marker: without this rule the body would sit on as a
          # noncurrent version under expire-superseded-versions for
          # another 365 days, about 455 in all, against the 90 that
          # limits.md promises.
          # The noncurrent body goes a day after the marker, then the
          # marker itself. ExpiredObjectDeleteMarker cannot share a rule
          # with ExpirationInDays, hence a rule of its own.
          - Id: calls-purge-expired
            Status: Enabled
            Prefix: calls/
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            ExpiredObjectDeleteMarker: true
          # Payloads are content-addressed, so an overwrite means
          # something went wrong rather than something changed. Keep a
          # year of superseded versions - long enough to notice and
          # recover, bounded so a loop cannot grow the bill forever.
          - Id: expire-superseded-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # The payload archive is write-once. Versioning
  # keeps an overwritten object for only a year, and the internet-facing
  # collector door holds s3:PutObject on payloads/, so a put that could replace
  # a key is refused for every principal: the door sends
  # If-None-Match: * (packages/ingest/src/handler.mjs) and reads a 412 as
  # already archived. The ObjectCreationOperation clause leaves the
  # multipart steps that cannot carry the header alone; a CopyObject into
  # payloads/ is refused too, and nothing copies there. Tried first on a
  # scratch bucket (2026-09-28): an unconditional put 403, a conditional
  # put of a new key 200, of an existing key 412, other prefixes
  # unaffected. After the writer so the code that sends the header is in
  # place before the policy that demands it.
  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: CollectorFunction
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PayloadsWriteOnce
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${ArchiveBucket.Arn}/payloads/*
            Condition:
              "Null":
                s3:if-none-match: "true"
              Bool:
                s3:ObjectCreationOperation: "true"

  GlueArchiveDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: elixir_mcp_archive
        Description: Athena over the S3 payload archive (raw CR API payloads, one JSON doc per object)

  # One raw-JSON-lines table with partition projection - no crawler, no
  # maintenance. Queries pin entity (injected projection); cross-entity
  # archaeology is DuckDB's job.
  GlueArchivePayloadsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueArchiveDatabase
      TableInput:
        Name: payloads
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.endpoint.type: enum
          # Every archived endpoint; a test pins this to the ingest
          # projector keys (ARCHIVED_ENDPOINTS), because an endpoint
          # missing here is invisible to every Athena query.
          projection.endpoint.values: player_battlelog,clan,player,currentriverrace,riverracelog,events,globaltournaments,cards
          projection.entity.type: injected
          projection.dt.type: date
          projection.dt.range: 2026-02-01,NOW
          projection.dt.format: yyyy-MM-dd
          storage.location.template: !Sub s3://elixir-mcp-archive-${AWS::AccountId}/payloads/endpoint=${!endpoint}/entity=${!entity}/dt=${!dt}
        PartitionKeys:
          - { Name: endpoint, Type: string }
          - { Name: entity, Type: string }
          - { Name: dt, Type: string }
        StorageDescriptor:
          Location: !Sub s3://elixir-mcp-archive-${AWS::AccountId}/payloads/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            # LazySimpleSerDe's default field delimiter is \u0001, which
            # never appears in JSON text - the whole line lands in `json`.
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
          Columns:
            - { Name: json, Type: string }

  # CloudFront standard (access) logs for the one hostname. Turned on
  # 2026-09-12 after a browser-side stall left no trace at the origin:
  # Lambda, API Gateway and CloudFront metrics were all clean, so the
  # edge's own request log is the only evidence that can place the next
  # one. ACLs stay enabled on this bucket because standard logging is
  # delivered through the awslogsdelivery ACL grant; 30 days matches the
  # Lambda log groups.
  EdgeLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elixir-mcp-edge-logs-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-30d
            Status: Enabled
            ExpirationInDays: 30

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elixir-mcp-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: elixir-mcp-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cookies and the contract header flow to the site API; caching off.
  # user-agent is forwarded for the Profile page's device list (a short
  # label is derived from it; the string itself is never stored). The
  # x-collector-* headers are what a collector says it runs; a header
  # missing here never reaches the door (0184 shipped reading two that
  # were not listed, and every collector read unverified). A test holds
  # this list to the headers the door reads. CloudFront allows ten.
  SiteApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: elixir-mcp-site-api
        CookiesConfig: { CookieBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            [
              x-elixir-client,
              content-type,
              authorization,
              x-collector-version,
              x-collector-binary-sha256,
              x-collector-release-key,
              user-agent,
              cloudfront-viewer-address,
              cloudfront-viewer-country,
            ]
        QueryStringsConfig: { QueryStringBehavior: all }

  # The ONE door route that sees the session cookie: the consent page.
  # A person signed in to the site consents without a code, and a person
  # who consents by code is signed in to the site (0083). Only that
  # cookie, and only on /oauth/authorize; /mcp, /oauth/token and every
  # other door route keep the no-cookie policy below.
  OauthAuthorizeOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: elixir-mcp-oauth-authorize
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-elixir_session]
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            [
              content-type,
              user-agent,
              cloudfront-viewer-address,
              cloudfront-viewer-country,
            ]
        QueryStringsConfig: { QueryStringBehavior: all }

  # The structural guarantee: the MCP door forwards NO cookies, ever.
  McpOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: elixir-mcp-mcp-door
        CookiesConfig: { CookieBehavior: none }
        HeadersConfig:
          HeaderBehavior: whitelist
          # viewer-address and viewer-country are what let an owner see WHERE
          # a credential is being used from. CloudFront adds them; the origin
          # cannot derive either (sourceIp is an edge node). Still no cookies.
          Headers:
            [
              authorization,
              content-type,
              mcp-protocol-version,
              idempotency-key,
              cloudfront-viewer-address,
              cloudfront-viewer-country,
            ]
        QueryStringsConfig: { QueryStringBehavior: all }

  # Browser security headers on every response (#25). Before this, the
  # site shipped no CSP, no frame-ancestors, no nosniff, no
  # Referrer-Policy and no Permissions-Policy.
  #
  # script-src has NO 'unsafe-inline': the static half's scripts are all
  # external files for this reason (the access-request form was the last
  # inline block; it moved to the app entirely on 2026-09-10). tinylytics.app is allowed because BOTH halves load it:
  # #25 briefly kept the embed off app.html and that protected nothing,
  # since the session cookie is Path=/ and the embed still ran on every
  # static page of the same origin (reverted 2026-09-08). So this list
  # IS the boundary, not a backstop behind one - connect-src names
  # tinylytics.app for the same reason, because the app's route bridge
  # beacons navigation to the collector.
  #
  # style-src does allow 'unsafe-inline', stated rather than hidden:
  # the Eleventy templates carry ~70 style="" attributes and the OAuth
  # consent page is one self-contained document with a <style> block.
  # Inline STYLE cannot execute; the exposure is CSS-based exfiltration
  # of attacker-injected markup, which is a much smaller thing than
  # inline script, and tightening it means refactoring markup rather
  # than changing a header. Recorded as a deliberate trade.
  #
  # img-src needs Supercell's asset CDN: collector avatars are the
  # cards' own iconUrls, served straight from api-assets.clashroyale.com.
  # Elixir Clan, served here under /clan, draws its map from OpenStreetMap
  # tiles.
  # Fonts are self-hosted under /assets/fonts/ (no font CDN, so no
  # third party learns who read which page). Every origin here was taken
  # from the BUILT output, not from memory - a CSP written from what you
  # think the page loads is a CSP that breaks the page.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: elixir-mcp-security-headers
        Comment: CSP, HSTS, nosniff, referrer and permissions policy
        SecurityHeadersConfig:
          # NOT overridden, and that is load-bearing. The OAuth consent pages
          # set their own CSP because they must permit a cross-origin
          # form-action: the browser applies form-action to the REDIRECT of a
          # form POST, so `form-action 'self'` silently blocks the 303 back to
          # the client's callback. WebKit enforces this; the tap simply does
          # nothing, with no error anywhere. Forcing this header from the edge
          # replaced the origin's deliberate `form-action https:` and broke
          # every attempt to connect an MCP client from an iPhone
          # (2026-09-09). Origins that send no CSP -- the static site, the JSON
          # APIs -- still get this one.
          ContentSecurityPolicy:
            Override: false
            ContentSecurityPolicy: >-
              default-src 'self';
              base-uri 'self';
              object-src 'none';
              frame-ancestors 'none';
              form-action 'self';
              script-src 'self' https://tinylytics.app;
              connect-src 'self' https://tinylytics.app;
              img-src 'self' data: https://api-assets.clashroyale.com https://tinylytics.app https://tile.openstreetmap.org;
              font-src 'self';
              style-src 'self' 'unsafe-inline'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          # Two years, subdomains included. NOT preloaded: preload is
          # effectively irreversible and belongs to a domain decision,
          # not a deploy.
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
        CustomHeadersConfig:
          Items:
            # Permissions-Policy has no first-class field in the managed
            # security config, so it rides as a custom header. Nothing
            # here needs any of these.
            - Header: Permissions-Policy
              Override: true
              Value: >-
                accelerometer=(), camera=(), display-capture=(),
                geolocation=(), gyroscope=(), magnetometer=(),
                microphone=(), payment=(), usb=()

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    # The doors take a rotated origin secret (and keep the previous one)
    # before CloudFront starts sending it (docs/SECRETS.md).
    DependsOn: [WebApiFunction, McpFunction, CollectorFunction]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: elixir.poapkings.com
        HttpVersion: http2and3
        Logging:
          Bucket: !GetAtt EdgeLogBucket.RegionalDomainName
          Prefix: cloudfront/
          IncludeCookies: false
        Aliases: !If [HasSiteCert, [elixir.poapkings.com], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasSiteCert
          - AcmCertificateArn: !Ref SiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub ${SiteApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginCustomHeaders: !If
              - HasOriginSecret
              - - HeaderName: x-elixir-origin
                  HeaderValue: !Ref OriginSecret
              - !Ref AWS::NoValue
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: mcpapi
            DomainName: !Sub ${McpApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginCustomHeaders: !If
              - HasOriginSecret
              - - HeaderName: x-elixir-origin
                  HeaderValue: !Ref OriginSecret
              - !Ref AWS::NoValue
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # An address the site does not build (2026-10-08). The bucket
        # answers a missing key 403 (the distribution may not list it),
        # which showed raw S3 XML. On a 403 or 404 from the bucket, the
        # default behaviour's group fails over to the API with the same
        # path, and the web API answers the site's 404.html with a true
        # 404 (services/web-api routes/site-miss.mjs). Scoped to the site
        # behaviour: the API, MCP and OAuth behaviours target their own
        # origins and keep their own refusals (see the note under
        # CacheBehaviors on why this is not a CustomErrorResponse).
        OriginGroups:
          Quantity: 1
          Items:
            - Id: site-or-miss
              FailoverCriteria:
                StatusCodes:
                  Quantity: 2
                  Items: [403, 404]
              Members:
                Quantity: 2
                Items:
                  - OriginId: site
                  - OriginId: api
        DefaultCacheBehavior:
          TargetOriginId: site-or-miss
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          # Site routing lives HERE, on the site behavior and Clan's two
          # app behaviors only, so it cannot reach the API, MCP or OAuth
          # behaviors below.
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouter.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The public reads, CACHED (#23, #73). Every /api/public route
          # runs real aggregation (status several time-series queries,
          # stats the whole corpus, efficiency two api_receipt x
          # capture_audit scans, the card pages the nightly rollup) and
          # states its own freshness in Cache-Control. Under the /api/*
          # CachingDisabled behaviour every hit recomputed them and
          # x-cache said Miss every time; #23 cached status and stats by
          # name, and the card pages and efficiency kept missing. One
          # prefix covers every public read, present and future; a test
          # holds each route to GET with its own max-age. Listed FIRST
          # because CloudFront takes the first pattern that matches, not
          # the most specific one.
          #
          # GET/HEAD only, and no origin request policy: no cookie, no
          # header and no query string reaches the origin, so one cached
          # object serves everyone. That is correct here precisely
          # because these responses are identical for every caller -
          # the same property that makes them safe to cache is what
          # makes them public.
          - PathPattern: /api/public/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            # AWS managed CachingOptimized: honours the origin's own
            # Cache-Control, forwards nothing.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          # A battle's public page (Jamie, 2026-10-01: "Public yes."):
          # the web-api serves the app shell with the battle's preview
          # tags, so a pasted link unfurls as the battle. Cached like the
          # public reads, for the same reason: nothing reaches the origin
          # but the path, and every visitor gets the same page.
          - PathPattern: /battle/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
          - PathPattern: /api/v1/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          # Elixir Clan's API, listed before /api/*, which would take it.
          - PathPattern: /api/clan/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref SiteApiOriginRequestPolicy
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # AWS managed CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref SiteApiOriginRequestPolicy
          # The MCP/OAuth door, path-split on the one hostname. The
          # no-cookie origin request policy is the structural guarantee:
          # session cookies can never reach these routes (docs/ENGINEERING.md).
          - PathPattern: /mcp
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          # Agent and integration doors (0054). Same origin, same no-cookie
          # policy as /mcp -- these are the same protected resource served
          # under a per-principal identity, and a session cookie must never
          # reach one. Without these the Lambda's routing is correct and
          # unreachable: the edge answers /a/* with its own 403 HTML and the
          # door never sees the request.
          - PathPattern: /a/*
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          - PathPattern: /i/*
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          # Listed before /oauth/*: CloudFront takes the first pattern
          # that matches. GET and POST both carry the cookie (the consent
          # form posts back here); SameSite=Lax keeps a cross-site POST
          # from carrying it.
          - PathPattern: /oauth/authorize
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref OauthAuthorizeOriginRequestPolicy
          - PathPattern: /oauth/*
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          - PathPattern: /.well-known/*
            TargetOriginId: mcpapi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref McpOriginRequestPolicy
          # Elixir Clan's app (2026-09-28): its own bucket, routed by the
          # same function as the site. Two patterns, because /clan* would
          # also take /clans.
          - PathPattern: /clan
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRouter.FunctionMetadata.FunctionARN
          - PathPattern: /clan/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRouter.FunctionMetadata.FunctionARN
        # No CustomErrorResponses: those are DISTRIBUTION-wide, so
        # rewriting 403/404 to a 200 app shell also rewrote the API's
        # own refusals. An unauthenticated /api/admin/requests came back
        # 200 text/html, and the web client read that as success. Site
        # routing is done by SpaRouter on the site behavior instead,
        # and a missing page or asset is now honestly a miss: the
        # site-or-miss origin group above answers it with the site's
        # 404 page, on the default behaviour alone.

  # Routes each path to the half of the site that owns it, without
  # touching status codes anywhere else on the distribution.
  #
  # The site is two builds in one bucket (2026-09-07). apps/site emits
  # real documents for the content pages; apps/web is the application,
  # served from /app.html. Before the split every extension-less path
  # was rewritten to the one shared shell, so all ten sitemap URLs
  # returned byte-identical HTML and no crawler or agent could read the
  # docs at all.
  #
  # One origin, paths not hostnames (2026-09-28): the Console lives
  # under /console, Ladder under /ladder (a section of the same app),
  # Elixir Clan under /clan, and everything else is the site's, so the
  # rule is a prefix, not a list of pages to keep in step.
  # The MCP, OAuth and API paths never reach this function: they are
  # their own behaviours. Clan's two behaviours share it; each origin
  # sees only its own paths, because the behaviours split them first.
  SpaRouter:
    Type: AWS::CloudFront::Function
    Properties:
      # Logical id and Name are historical: this was the SPA router
      # before the site was split. Changing either forces a replacement
      # of a function attached to the live distribution, which is not
      # worth a better name.
      Name: elixir-mcp-spa-router
      AutoPublish: true
      FunctionConfig:
        Comment: Route content paths to the static site and app paths to their app shell
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // A path whose last segment has an extension is asking for a
          // real file; if it is not there, that is a 404 and must stay
          // one. This covers every asset, llms.txt, tools.json,
          // sitemap.xml and robots.txt.
          if (uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') !== -1) {
            return request;
          }

          if (uri === '/' || uri === '') {
            request.uri = '/index.html';
            return request;
          }

          // Match without a trailing slash: both spellings of a page
          // resolve to the same document.
          var key = uri.charAt(uri.length - 1) === '/'
            ? uri.substring(0, uri.length - 1)
            : uri;

          // The Console owns /console and everything under it; the app
          // resolves its own paths (and sends a stale one home).
          if (key === '/console' || key.indexOf('/console/') === 0) {
            request.uri = '/app.html';
            return request;
          }

          // Ladder is a section of the same app beside the Console: the
          // same shell, its own rail (2026-09-28).
          if (key === '/ladder' || key.indexOf('/ladder/') === 0) {
            request.uri = '/app.html';
            return request;
          }

          // Clan uses the common application shell.
          if (key === '/clan' || key.indexOf('/clan/') === 0) {
            request.uri = '/app.html';
            return request;
          }

          // Every other path is a site document. One the site does not
          // build is an honest miss, the same as a missing asset: the
          // Console's old addresses at the root are not aliased.
          request.uri = key + '/index.html';
          return request;
        }

  # ------------------------------------------------------------ monitoring
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elixir-mcp-alarms
      # Routing of record is the sysadmin projects-ops-alerts queue; that
      # subscription is managed in the projects-sysadmin repo. No email.

  # A topic policy REPLACES the default one, so the account-owner
  # statement SNS would have written is restated first; the second lets
  # SES publish sending events from this stack's configuration set.
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: owner
            Effect: Allow
            Principal: { AWS: "*" }
            Action:
              [
                SNS:Publish,
                SNS:Subscribe,
                SNS:Receive,
                SNS:GetTopicAttributes,
                SNS:SetTopicAttributes,
                SNS:ListSubscriptionsByTopic,
                SNS:AddPermission,
                SNS:RemovePermission,
                SNS:DeleteTopic,
              ]
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: { AWS:SourceOwner: !Ref AWS::AccountId }
          - Sid: ses-events
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: SNS:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike:
                aws:SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/elixir-mcp

  DlqAlarmEmail:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-dlq-email
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EmailDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DlqAlarmTimelineSync:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-dlq-timeline-sync
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        [{ Name: QueueName, Value: !GetAtt TimelineSyncDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DlqAlarmTimelineDiscord:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-dlq-timeline-discord
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        [{ Name: QueueName, Value: !GetAtt TimelineDiscordDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  JobsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-jobs-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref JobsFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A migrate invocation that runs long is a diagnostics op scanning the
  # production database (the 2026-09-11 14:02Z recovery followed thirteen
  # two-minute probe runs), or a migration that needs a human watching.
  # Migrations themselves take seconds.
  MigrateDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-migrate-duration
      AlarmDescription: A migrate Lambda invocation ran longer than 90 s; a diagnostics op is scanning production
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref MigrateFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LedgerOldestJobAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-ledger-oldest-job
      AlarmDescription: Oldest queued job is stale; the fleet is down or drowning
      Namespace: ElixirMCP/Ledger
      MetricName: OldestQueuedAgeSeconds
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1800
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LedgerDeadJobsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-ledger-dead-jobs
      AlarmDescription: Jobs exhausted their retries; inspect the job table
      Namespace: ElixirMCP/Ledger
      MetricName: DeadJobs
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The season row's derived war number disagreed with a riverracelog
  # entry (0104; packages/record/src/season.mjs): the calendar the record
  # files everything under is wrong for that month. Nothing relabels
  # itself; a human reads the season table and the log entry.
  SeasonMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-season-war-id-mismatch
      AlarmDescription: A river race log entry carried a seasonId the season calendar does not derive; check the season table against the log
      Namespace: ElixirMCP/Record
      MetricName: SeasonWarIdMismatch
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A product email that failed to compose for one account
  # (email_compose_failed in the jobs log): the run itself succeeds, so
  # the Lambda Errors alarm never sees it. 2026-09-19: every product send
  # since the 09-18 evening deploy had thrown in the renderer for a day
  # with nothing paging. One failure is worth a look.
  EmailComposeFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref JobsLogGroup
      FilterPattern: '"email_compose_failed"'
      MetricTransformations:
        - MetricNamespace: ElixirMCP/Email
          MetricName: ComposeFailed
          MetricValue: "1"
          # No DefaultValue: a default writes a zero on every jobs log
          # event and bills the metric every hour; without one it exists
          # only when a compose fails, and the alarm fires the same.
  # A family app's mail composes in the web-api (JSON API 2.4.0): its
  # failures count toward the same metric and alarm.
  WebApiEmailComposeFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebApiLogGroup
      FilterPattern: '"email_compose_failed"'
      MetricTransformations:
        - MetricNamespace: ElixirMCP/Email
          MetricName: ComposeFailed
          MetricValue: "1"
  EmailComposeFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-email-compose-failed
      AlarmDescription: A product email failed to compose for an account (email_compose_failed in the jobs log); the run succeeded, the send did not
      Namespace: ElixirMCP/Email
      MetricName: ComposeFailed
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A collector submit the door could not ingest (submit_ingest_error in
  # the collector's log, after its one retry of a deadlock or racing
  # upsert; the web-api's log carried it until 2026-09-29):
  # the door answers 500, which is handled, so the Lambda Errors alarm
  # never counts it, and the lease expires into a refetch (review
  # 2026-09-27 §2.5). Two weeks before the retry: at most 7 in any 15
  # minutes on an ordinary day (the 10:00Z rollover), 20 to 60 in the
  # three incidents (connections terminated, a column missing mid-deploy).
  # Ten in 15 minutes is an incident, not the churn.
  CollectorSubmitIngestErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CollectorLogGroup
      FilterPattern: '"submit_ingest_error"'
      MetricTransformations:
        - MetricNamespace: ElixirMCP/Collector
          MetricName: SubmitIngestError
          MetricValue: "1"
          # No DefaultValue, as EmailComposeFailedFilter: the metric
          # exists only in an hour a submit fails.
  SubmitIngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-submit-ingest-error
      AlarmDescription: Collector submits are failing to ingest (submit_ingest_error in the collector log); each one is a 500, an expired lease and a refetch
      Namespace: ElixirMCP/Collector
      MetricName: SubmitIngestError
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A war-typed battle in the last seven days outside every war_period
  # row (the diagnostics probe's UNRESOLVED bucket, emitted hourly by the
  # meta rollup job): the scheduler's season upsert failed and the war
  # readers are blind to those battles. Fires at one.
  WarUnresolvedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-war-battle-unresolved
      AlarmDescription: A recent war battle falls in no war_period row; the season and period calendar has a gap (check the scheduler tick and the season table)
      Namespace: ElixirMCP/Record
      MetricName: WarBattleUnresolved
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SchedulerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-scheduler-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SchedulerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SchedulerMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-scheduler-missing
      AlarmDescription: The planner stopped ticking; recording is stalled
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref SchedulerFunction }]
      Statistic: Sum
      # 15-minute windows so any tick cadence up to rate(15 minutes) is
      # covered without retuning the alarm alongside SchedulerTickMinutes.
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  # The user-facing doors: the pipeline was fully
  # alarmed but a 500ing MCP or web-api lambda was invisible - users
  # would find out before the ops queue did.
  McpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-mcp-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref McpFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WebApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-web-api-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WebApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-collector-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref CollectorFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  McpLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-mcp-latency-p95
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref McpFunction }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-db-cpu
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-db-storage
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DbConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-db-connections
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Failures the doors handle themselves (review 2026-09-27 §8.6, issue
  # #71). The invoker catches every tool exception and answers an
  # `internal` result (tool_failed_unexpectedly, in the MCP door and in
  # the web-api's Explore and /api/v1, which run the same invoker), and a
  # refused database connection becomes a handled 503 (db_connect_failed
  # in the MCP door). Neither is a Lambda error, so McpErrorsAlarm fired
  # only when the door itself crashed: a deploy that broke a shared tool
  # path paged nobody until acceptance, the Gym or feedback noticed. Three
  # in ten minutes is a broken path, not one unlucky call.
  McpHandledFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref McpLogGroup
      FilterPattern: '?"tool_failed_unexpectedly" ?"db_connect_failed"'
      MetricTransformations:
        - MetricNamespace: ElixirMCP/Door
          MetricName: HandledFailure
          MetricValue: "1"
          # No DefaultValue, as EmailComposeFailedFilter: the metric
          # exists only in an hour a door fails.
  WebApiHandledFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebApiLogGroup
      FilterPattern: '"tool_failed_unexpectedly"'
      MetricTransformations:
        - MetricNamespace: ElixirMCP/Door
          MetricName: HandledFailure
          MetricValue: "1"
  HandledFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-door-handled-failures
      AlarmDescription: Tools are failing unexpectedly or the MCP door cannot reach the database (tool_failed_unexpectedly or db_connect_failed in the MCP or web-api log); callers get internal or 503 answers, and no Lambda error is counted
      Namespace: ElixirMCP/Door
      MetricName: HandledFailure
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The web-api's own latency: its handler answers 504 at
  # its deadline, which is handled, so the Errors alarm never sees a slow
  # door. Duration is free, as for McpLatencyAlarm; p95 over 15 s for a
  # quarter hour is a door mostly timing out under its 20 s kill.
  WebApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-web-api-latency-p95
      AlarmDescription: The web-api's p95 duration is over 15 s; it is answering 504 at its deadline
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref WebApiFunction }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 15000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The collector door's latency, for the same reason: it answers 504 at
  # its deadline. Its calls are short (lease p95 61 ms, submit p95 388 ms
  # over the three days to 2026-09-29), so 5 s at p95 for a quarter hour
  # is a door in trouble long before its 20 s kill.
  CollectorLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-collector-latency-p95
      AlarmDescription: The collector door's p95 duration is over 5 s; leases and submits are slow or answering 504
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref CollectorFunction }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The database's two documented failure modes: the micro
  # ran its EBS byte balance to 0 three times, and there were two memory
  # recoveries on 2026-09-11. Both are free RDS metrics. Under a quarter
  # of the burst balance left, reads are about to be held to the
  # baseline; under about 64 MB freeable, the micro is near a recovery
  # (150 MB on the small; the old micro idled at 80-260 MB).
  DbEbsByteBalanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-db-ebs-byte-balance
      AlarmDescription: The database's EBS byte balance is below 25%; at 0 its reads are held to the baseline throughput
      Namespace: AWS/RDS
      MetricName: EBSByteBalance%
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DbFreeableMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-mcp-db-freeable-memory
      AlarmDescription: The database has under about 64 MB of freeable memory; memory recoveries followed a squeeze like this on 2026-09-11
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 67108864
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The site certificate: ACM renews it only while the
  # validation CNAME, kept by hand at Namecheap, still resolves. ACM
  # publishes DaysToExpiry daily; 30 days is a month to fix the record.
  SiteCertificateExpiryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasSiteCert
    Properties:
      AlarmName: elixir-mcp-site-certificate-expiry
      AlarmDescription: The elixir.poapkings.com certificate expires in under 30 days; ACM has not renewed it (check the validation CNAME at Namecheap)
      Namespace: AWS/CertificateManager
      MetricName: DaysToExpiry
      Dimensions: [{ Name: CertificateArn, Value: !Ref SiteCertificateArn }]
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The one dashboard (Jamie, 2026-10-09): standard AWS metrics and the
  # custom metrics that already back alarms, never a metric of its own.
  # It is the third custom dashboard in the account (Drop and YVN are the
  # others), so it is free while it references at most 50 metrics; keep
  # the graphs under that. Per-tool and fleet detail comes from Logs
  # Insights over the log lines the doors and scheduler already write.
  # The certificate alarm is conditional (HasSiteCert) and left off.
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: elixir-mcp
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "periodOverride": "inherit",
          "widgets": [
            { "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "## Elixir\nTop to bottom: alarms, the doors people and agents use, recording, the database, mail, then tools read from the MCP log. Alarms page the projects-ops-alerts queue; this page is for looking. It adds no metrics: a custom metric still exists only to back an alarm (docs/DECISIONS.md)." } },

            { "type": "alarm", "x": 0, "y": 2, "width": 24, "height": 4,
              "properties": { "title": "Alarms", "sortBy": "stateUpdatedTimestamp", "alarms": [
                "${McpErrorsAlarm.Arn}", "${McpLatencyAlarm.Arn}", "${HandledFailureAlarm.Arn}",
                "${WebApiErrorsAlarm.Arn}", "${WebApiLatencyAlarm.Arn}",
                "${CollectorErrorsAlarm.Arn}", "${CollectorLatencyAlarm.Arn}", "${SubmitIngestErrorAlarm.Arn}",
                "${SchedulerErrorsAlarm.Arn}", "${SchedulerMissingAlarm.Arn}", "${JobsErrorsAlarm.Arn}",
                "${LedgerOldestJobAlarm.Arn}", "${LedgerDeadJobsAlarm.Arn}",
                "${WarUnresolvedAlarm.Arn}", "${SeasonMismatchAlarm.Arn}", "${MigrateDurationAlarm.Arn}",
                "${DbCpuAlarm.Arn}", "${DbFreeableMemoryAlarm.Arn}", "${DbStorageAlarm.Arn}",
                "${DbConnectionsAlarm.Arn}", "${DbEbsByteBalanceAlarm.Arn}",
                "${DlqAlarmEmail.Arn}", "${EmailComposeFailedAlarm.Arn}"
              ] } },

            { "type": "metric", "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Doors: requests", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300, "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${McpFunction}", { "label": "mcp" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${WebApiFunction}", { "label": "web-api" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CollectorFunction}", { "label": "collector" }]
                ] } },
            { "type": "metric", "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Doors: errors and handled failures", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300, "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${McpFunction}", { "label": "mcp errors" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${WebApiFunction}", { "label": "web-api errors" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${CollectorFunction}", { "label": "collector errors" }],
                  ["ElixirMCP/Door", "HandledFailure", { "label": "handled failures (mcp + web-api)" }]
                ] } },
            { "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": { "title": "Doors: p95 duration (ms)", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300, "stat": "p95",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${McpFunction}", { "label": "mcp (alarm 8 s)" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "${WebApiFunction}", { "label": "web-api (alarm 15 s)" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "${CollectorFunction}", { "label": "collector (alarm 5 s)" }]
                ],
                "annotations": { "horizontal": [
                  { "label": "collector alarm", "value": 5000 },
                  { "label": "mcp alarm", "value": 8000 },
                  { "label": "web-api alarm", "value": 15000 }
                ] } } },

            { "type": "metric", "x": 0, "y": 12, "width": 8, "height": 6,
              "properties": { "title": "CloudFront: requests and error rates", "region": "us-east-1", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [
                  ["AWS/CloudFront", "Requests", "DistributionId", "${SiteDistribution}", "Region", "Global", { "stat": "Sum", "label": "requests" }],
                  ["AWS/CloudFront", "5xxErrorRate", "DistributionId", "${SiteDistribution}", "Region", "Global", { "stat": "Average", "label": "5xx %", "yAxis": "right" }],
                  ["AWS/CloudFront", "4xxErrorRate", "DistributionId", "${SiteDistribution}", "Region", "Global", { "stat": "Average", "label": "4xx %", "yAxis": "right" }]
                ] } },
            { "type": "log", "x": 8, "y": 12, "width": 16, "height": 6,
              "properties": { "title": "Tools: calls, p95 and max ms (MCP log)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${McpLogGroup}' | filter rpc = 'tools/call' | stats count(*) as calls, pct(ms, 95) as p95_ms, max(ms) as max_ms by tool | sort calls desc | limit 25" } },

            { "type": "metric", "x": 0, "y": 18, "width": 8, "height": 6,
              "properties": { "title": "Recording: scheduler ticks and jobs runs", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300, "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${SchedulerFunction}", { "label": "scheduler ticks" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${JobsFunction}", { "label": "jobs runs" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${JobsFunction}", { "label": "jobs errors" }]
                ] } },
            { "type": "metric", "x": 8, "y": 18, "width": 8, "height": 6,
              "properties": { "title": "Recording: job ledger and submits", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 900,
                "metrics": [
                  ["ElixirMCP/Ledger", "OldestQueuedAgeSeconds", { "stat": "Maximum", "label": "oldest queued job (s)" }],
                  ["ElixirMCP/Ledger", "DeadJobs", { "stat": "Maximum", "label": "dead jobs", "yAxis": "right" }],
                  ["ElixirMCP/Collector", "SubmitIngestError", { "stat": "Sum", "label": "submit ingest errors", "yAxis": "right" }]
                ],
                "annotations": { "horizontal": [ { "label": "oldest-job alarm", "value": 1800 } ] } } },
            { "type": "log", "x": 16, "y": 18, "width": 8, "height": 6,
              "properties": { "title": "Recording: fleet pace (scheduler log)", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false,
                "query": "SOURCE '${SchedulerLogGroup}' | filter ispresent(OldestQueuedAgeSeconds) | stats max(FetchesHour) as fetches_hour, max(FetchErrorsHour) as fetch_errors_hour, max(QueuedJobs) as queued, max(CollectorsActive) as collectors by bin(30m)" } },

            { "type": "metric", "x": 0, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: CPU % and credits", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [
                  ["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${Database}", { "stat": "Average", "label": "CPU %" }],
                  ["AWS/RDS", "CPUCreditBalance", "DBInstanceIdentifier", "${Database}", { "stat": "Minimum", "label": "credits", "yAxis": "right" }]
                ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": 85 } ] } } },
            { "type": "metric", "x": 4, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: freeable memory", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [ ["AWS/RDS", "FreeableMemory", "DBInstanceIdentifier", "${Database}", { "stat": "Minimum", "label": "freeable" }] ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": 67108864 } ] } } },
            { "type": "metric", "x": 8, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: connections", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [ ["AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "${Database}", { "stat": "Maximum", "label": "connections" }] ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": 60 } ] } } },
            { "type": "metric", "x": 12, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: EBS byte balance %", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [ ["AWS/RDS", "EBSByteBalance%", "DBInstanceIdentifier", "${Database}", { "stat": "Minimum", "label": "byte balance" }] ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": 25 } ] } } },
            { "type": "metric", "x": 16, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: read and write IOPS", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300, "stat": "Average",
                "metrics": [
                  ["AWS/RDS", "ReadIOPS", "DBInstanceIdentifier", "${Database}", { "label": "read" }],
                  ["AWS/RDS", "WriteIOPS", "DBInstanceIdentifier", "${Database}", { "label": "write" }]
                ] } },
            { "type": "metric", "x": 20, "y": 24, "width": 4, "height": 6,
              "properties": { "title": "DB: free storage", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 900,
                "metrics": [ ["AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "${Database}", { "stat": "Minimum", "label": "free" }] ],
                "annotations": { "horizontal": [ { "label": "alarm", "value": 2147483648 } ] } } },

            { "type": "metric", "x": 0, "y": 30, "width": 12, "height": 6,
              "properties": { "title": "Mail: queue and dead letters", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 300,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EmailQueue.QueueName}", { "stat": "Maximum", "label": "queued" }],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EmailDlq.QueueName}", { "stat": "Maximum", "label": "dead letters" }],
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${EmailQueue.QueueName}", { "stat": "Maximum", "label": "oldest (s)", "yAxis": "right" }]
                ] } },
            { "type": "metric", "x": 12, "y": 30, "width": 12, "height": 6,
              "properties": { "title": "Mail: relay runs, errors and failed composes", "region": "${AWS::Region}", "view": "timeSeries", "stacked": false, "period": 3600, "stat": "Sum",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${EmailRelayFunction}", { "label": "relay runs" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${EmailRelayFunction}", { "label": "relay errors", "yAxis": "right" }],
                  ["ElixirMCP/Email", "ComposeFailed", { "label": "failed composes", "yAxis": "right" }]
                ] } },

            { "type": "log", "x": 0, "y": 36, "width": 12, "height": 7,
              "properties": { "title": "Tools: refused or failed calls by status (MCP log)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${McpLogGroup}' | filter rpc = 'tools/call' and status >= 400 | stats count(*) as calls by tool, status | sort calls desc | limit 25" } },
            { "type": "log", "x": 12, "y": 36, "width": 12, "height": 7,
              "properties": { "title": "Tools: slowest calls (open request_id at /console/account/activity/c/...)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${McpLogGroup}' | filter rpc = 'tools/call' | sort ms desc | fields @timestamp, tool, ms, status, request_id | limit 20" } }
          ]
        }

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  SiteDistributionDomain:
    Value: !GetAtt SiteDistribution.DomainName
    Description: CNAME target for elixir.poapkings.com at Namecheap (serves site, /api, /mcp, /oauth, /.well-known)
  SiteBucketName:
    Value: !Ref SiteBucket
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Description: Subscribe from projects-sysadmin to projects-ops-alerts
  # The DNS for sending as elixir@poapkings.com, all at Namecheap by hand.
  SenderDkimCname1:
    Value: !Sub "${SenderIdentity.DkimDNSTokenName1} CNAME ${SenderIdentity.DkimDNSTokenValue1}"
  SenderDkimCname2:
    Value: !Sub "${SenderIdentity.DkimDNSTokenName2} CNAME ${SenderIdentity.DkimDNSTokenValue2}"
  SenderDkimCname3:
    Value: !Sub "${SenderIdentity.DkimDNSTokenName3} CNAME ${SenderIdentity.DkimDNSTokenValue3}"
  SenderMailFromMx:
    Value: !Sub "bounce.poapkings.com MX 10 feedback-smtp.${AWS::Region}.amazonses.com"
  SenderMailFromSpf:
    Value: 'bounce.poapkings.com TXT "v=spf1 include:amazonses.com ~all"'
    Description: SPF for the MAIL FROM subdomain. The apex SPF, if any, also needs include:amazonses.com
