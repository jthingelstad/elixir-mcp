<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elixir MCP</title>
    <meta
      name="description"
      content="Clash Royale history, recorded — served to your own AI agent over MCP."
    />
    <!-- The application shell. It is served at /app.html for every route
         the app owns (sign in, account, explore, admin, the live data
         charts). It is deliberately NOT indexable: it renders nothing
         without JavaScript, and every page worth indexing is a real
         document built by apps/site. -->
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Elixir MCP" />
    <meta
      property="og:description"
      content="Clash Royale history, recorded — served to your own AI agent over MCP."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elixir MCP" />
    <meta
      property="og:image"
      content="https://elixir.poapkings.com/assets/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Elixir MCP: Clash Royale history, recorded."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://elixir.poapkings.com/assets/og.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
