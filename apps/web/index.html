<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Elixir</title>
    <meta
      name="description"
      content="Clash Royale history, recorded — served to your own AI agent over MCP."
    />
    <!-- The application shell. It is served at /app.html for every route
         the app owns (sign in, account, explore, admin, the live data
         charts). It is deliberately NOT indexable: it renders nothing
         without JavaScript, and every page worth indexing is a real
         document built by apps/site. -->
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Elixir" />
    <meta
      property="og:description"
      content="Clash Royale history, recorded — served to your own AI agent over MCP."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elixir" />
    <meta
      property="og:image"
      content="https://elixir.poapkings.com/assets/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Elixir: Clash Royale history, recorded."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://elixir.poapkings.com/assets/og.png"
    />
    <!-- Installable: the manifest, the icons, and the phone's chrome in
         the bar's colour. One set of tags, here and in apps/site's
         base.njk; a site test pins them alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1630" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Elixir" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
