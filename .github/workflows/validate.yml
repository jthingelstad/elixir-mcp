name: validate

# The merge gate (the PR workflow, 2026-09-26). main takes changes only
# through a pull request whose `validate` check is green (the branch need
# not be up to date with main, 2026-10-08), and deploy.mjs refuses a HEAD
# without a green `validate` (infra/scripts/lib/ci-gate.mjs). The job's name IS the
# required check's name in the main ruleset and the gate's lookup:
# rename all three together or merges and deploys stop.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running check; main's runs finish.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions; each job asks for its own. Actions are
# pinned to commit SHAs (Dependabot's monthly github-actions run moves
# them) and checkout leaves no token behind. infra/scripts/test-workflows.sh
# holds every workflow here to that, as a step below.
permissions: {}

jobs:
  # `npm run verify` split across runners so they run side by side
  # (2026-10-21): `static` is everything verify checks that is not a test,
  # and the `test` shards run the same runner verify runs
  # (infra/scripts/test.mjs), each its share of the workspaces by measured
  # time. The journeys run beside them. A pull request runs the journeys
  # only when it touches what they serve (infra/scripts/e2e-needed.sh); a
  # push to main always runs them. A skipped job would count as passing
  # for a required check, so `validate` always runs and checks each
  # result itself.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            e2e="$(git diff --name-only "$BASE" HEAD | sh infra/scripts/e2e-needed.sh)"
          else
            e2e=true
          fi
          echo "e2e: $e2e"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  static:
    name: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh infra/scripts/test-workflows.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Production dependencies must be clean of every advisory; every
      # dependency, the dev toolchain included, of high and critical ones
      # (2026-10-21: reported but ungated before, 12 high advisories had
      # piled up; #32). A high advisory with no fixed release is answered
      # in package.json `overrides` or by replacing the package, and the
      # change note says which.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
      - run: npm run verify:static
      # The Lambda bundles, as a deploy builds them (verify's last step).
      - run: npm run build && node infra/scripts/build.mjs

  # The workspace tests, three ways. The runner builds what the tests
  # read once, then runs its units concurrently; the shard holding the
  # site workspace builds the merged site tree (build-site.mjs
  # --skip-stats, which keeps CI off the live stats endpoint), so the
  # merged tree validates itself there (dead sitemap entries, dangling
  # llms.txt links, a missing app shell).
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node infra/scripts/test.mjs --shard ${{ matrix.shard }}/3

  # Journeys against the built tree behind the edge's document-or-shell
  # rule, /api/* answered by route fixtures: the real bundle, the real
  # router, the real chunks, axe on every page a journey lands on. Split
  # across shards by whole spec files, balanced on measured time
  # (infra/scripts/e2e-shard.mjs; Playwright's own --shard cuts by test
  # count, and the slow specs sort last), each building the tree once
  # (build-site.mjs runs the package build first). The browser is cached
  # on Playwright's version; its system libraries install every time.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node infra/scripts/build-site.mjs --skip-stats
      - run: |
          files="$(node infra/scripts/e2e-shard.mjs ${{ matrix.shard }}/3)"
          npm run e2e -- $files
      # No AWS credentials in validate; production uses the canonical deploy lane.

  validate:
    name: validate
    if: always()
    needs: [changes, static, test, e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WANT_E2E: ${{ needs.changes.outputs.e2e }}
          STATIC: ${{ needs.static.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, static: $STATIC, test: $TEST, e2e: $E2E (wanted: $WANT_E2E)"
          test "$CHANGES" = success && test "$STATIC" = success && test "$TEST" = success || exit 1
          if [ "$WANT_E2E" = true ]; then test "$E2E" = success; else test "$E2E" = skipped; fi
