name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Production dependencies must be clean, always. The dev
      # toolchain is reported but not gated: a fresh advisory against a
      # test runner should tell us, not stop a deploy of unrelated work
      # (#32).
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit || true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build -w @elixir-mcp/contracts
      - run: npm test -ws --if-present
      - run: node infra/scripts/build.mjs
      # The site build validates its own merged tree: dead sitemap
      # entries, dangling llms.txt links and a missing app shell fail
      # here. --skip-stats keeps CI off the live stats endpoint.
      - run: node infra/scripts/build-site.mjs --skip-stats
      # No AWS credentials in CI, ever (AGENTS.md): template validation
      # runs locally via aws cloudformation validate-template.
