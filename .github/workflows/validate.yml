name: validate

# The merge gate (the PR workflow, 2026-09-26). main takes changes only
# through a pull request whose `validate` check is green on a branch up
# to date with main, and deploy.mjs refuses a HEAD without a green
# `validate` (infra/scripts/lib/ci-gate.mjs). The job's name IS the
# required check's name in the main ruleset and the gate's lookup:
# rename all three together or merges and deploys stop.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running check; main's runs finish.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions; each job asks for its own. Actions are
# pinned to commit SHAs (Dependabot's monthly github-actions run moves
# them) and checkout leaves no token behind. infra/scripts/test-workflows.sh
# holds every workflow here to that, as a step below.
permissions: {}

jobs:
  # verify and the journeys run side by side; `validate` passes only when
  # both did. A pull request runs the journeys only when it touches what
  # they serve (infra/scripts/e2e-needed.sh); a push to main always runs
  # them. A skipped job would count as passing for a required check, so
  # `validate` always runs and checks each result itself.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            e2e="$(git diff --name-only "$BASE" HEAD | sh infra/scripts/e2e-needed.sh)"
          else
            e2e=true
          fi
          echo "e2e: $e2e"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh infra/scripts/test-workflows.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # Production dependencies must be clean, always. The dev
      # toolchain is reported but not gated: a fresh advisory against a
      # test runner should tell us, not stop a deploy of unrelated work
      # (#32).
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit || true
      # verify builds the site in the site workspace's test
      # (build-site.mjs --skip-stats, which keeps CI off the live stats
      # endpoint): the merged tree validates itself there (dead sitemap
      # entries, dangling llms.txt links, a missing app shell).
      - run: npm run verify
      - run: node infra/scripts/build.mjs

  # Journeys against the built tree behind the edge's document-or-shell
  # rule, /api/* answered by route fixtures: the real bundle, the real
  # router, the real chunks, axe on every page a journey lands on. Split
  # across shards, each building the same tree verify builds.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node infra/scripts/build-site.mjs --skip-stats
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
      # No AWS credentials in validate; production uses the canonical deploy lane.

  validate:
    name: validate
    if: always()
    needs: [changes, verify, e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WANT_E2E: ${{ needs.changes.outputs.e2e }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, verify: $VERIFY, e2e: $E2E (wanted: $WANT_E2E)"
          test "$CHANGES" = success && test "$VERIFY" = success || exit 1
          if [ "$WANT_E2E" = true ]; then test "$E2E" = success; else test "$E2E" = skipped; fi
