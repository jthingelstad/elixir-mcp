name: clan-deploy

# Elixir Clan (clan/) keeps its own stack and deploys from CI; the rest of
# this repository deploys locally with infra/scripts/deploy.mjs. This runs
# after validate is green on main. CI has no stored AWS key: the job runs
# in the `clan-production` environment (main only, no admin bypass) and
# assumes elixir-clan-github-deploy with GitHub's OIDC token; that role's
# trust names this repository's clan-production environment and nothing
# else. It passes the CloudFormation execution role to the stack. Both
# roles come from clan/infra/scripts/bootstrap.mjs, and
# clan/infra/scripts/parameters.mjs carries every operator-set parameter
# with UsePreviousValue, so a deploy from here can never reset one.
#
# Most merges here do not touch Clan. The SHA last deployed is kept in
# Clan's code bucket, and a run whose diff from it leaves Clan and the kit
# it builds from unchanged deploys nothing. A run superseded by a newer
# main leaves the marker alone, so the newer run still sees the change.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: clan-production
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run's branch filter matches a fork's branch named main
    # too: only a push to this repository's main deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: clan-production
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Only main's tip deploys, and a manual run only a SHA whose
      # validate check passed (a workflow_run already follows a green one).
      - name: Require the current main SHA and a green validate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$remote_sha" != "$sha" ]; then
            echo "superseded by ${remote_sha}; a later run deploys it"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=validate&filter=latest" --jq '.check_runs[0].conclusion // "none"')
            if [ "$state" != "success" ]; then
              echo "::error::validate on ${sha} is ${state}; nothing deployed"
              exit 1
            fi
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.SKIP != '1'
        with:
          role-to-assume: ${{ vars.ELIXIR_CLAN_DEPLOY_ROLE_ARN }}
          role-session-name: elixir-clan-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Skip when nothing Clan builds from changed since the last deploy
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "MARKER=s3://elixir-clan-code-${account}/deployed/main-sha" >> "$GITHUB_ENV"
          deployed=$(aws s3 cp "s3://elixir-clan-code-${account}/deployed/main-sha" - 2>/dev/null || true)
          if [ -n "$deployed" ] && git cat-file -e "${deployed}^{commit}" 2>/dev/null &&
            git diff --quiet "$deployed" HEAD -- clan packages/ui packages/client packages/design apps/web/public/assets/fonts package-lock.json; then
            echo "no Clan change since ${deployed}; nothing deployed"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SKIP != '1'
        with:
          node-version: 24
      - run: npm ci
        if: env.SKIP != '1'

      - name: Deploy
        if: env.SKIP != '1'
        run: node clan/infra/scripts/deploy.mjs
        env:
          AWS_REGION: us-east-1
          ELIXIR_CLAN_CFN_ROLE_ARN: ${{ vars.ELIXIR_CLAN_CFN_ROLE_ARN }}

      - name: Record the deployed SHA
        if: env.SKIP != '1'
        run: git rev-parse HEAD | aws s3 cp - "$MARKER"
