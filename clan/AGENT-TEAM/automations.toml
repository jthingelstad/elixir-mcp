version = 2
repo = "."
timezone = "America/Chicago"

# Drafted September 12, 2026; moved into elixir-mcp as clan/ on September
# 28; renamed, resumed and reinstalled September 29 at the cadences
# installed in Codex, one worktree of the elixir-mcp repository per run.
# Calendar starts use local Chicago time. launch_cwd is the repository
# root relative to this clan/ directory, and local_environment_config_path
# is relative to that root (installed as an absolute path). The installed
# ids of the feedback and security objectives carry an elixir-clan- prefix
# because elixir-mcp's own team uses close-the-loop and guard-the-door.
# schedule_of entries share the original objective, lease and automation
# memory. Event-driven follow-ups remain explicit starts.

[[automation]]
id = "run-elixir-clan"
name = "Clan Operator"
objective = "clan-run"
objective_file = "AGENT-TEAM/clan-operator.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=TU,FR;BYHOUR=5;BYMINUTE=15"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "worktree"
local_environment_config_path = ".codex/environments/environment.toml"
launch_cwd = ".."
prompt = "Follow the project instructions already loaded by Codex. This run has its own git worktree of elixir-mcp, prepared at a fresh origin/main by the repository's Codex environment; Elixir Clan is its `clan/` directory, and Clan's documents name paths relative to that directory. Read `clan/AGENTS.md`, the section \"One worktree per run\" of `AGENT-TEAM/WORKFLOW.md`, `clan/AGENT-TEAM/WORKFLOW.md`, `clan/AGENT-TEAM/READING.md`, `clan/AGENT-TEAM/README.md`, and `clan/AGENT-TEAM/clan-operator.md` completely; use the reading map to review the current product contract and the changed decisions in `clan/docs/NOTES.md`, then pursue the `clan-run` objective (Clan Operator) exactly as written. Run `AGENT-TEAM/scripts/preflight.sh` from the worktree root first and measure current live evidence before changing anything; a healthy no-op is success. Own a clear operational gap (a failed deploy, a broken smoke read, an unexplained alarm, an Elixir contract this product no longer matches, an ageing OAuth client registration) through source fix, regression coverage, `npm run verify`, deployment when required, and read-only live acceptance. Edit only in this worktree, on a `clan-run/<slug>` branch, and land every change as a pull request that merges on a green `validate` (a direct push to `main` is refused; never work around it); `clan-deploy` deploys `main`. Claim the `clan-run` lease (`node AGENT-TEAM/scripts/objective-lease.mjs` from the worktree root) only immediately before a live write or a local deploy, release it once verified, and never clear or break another holder's lease. This worktree is discarded after the run: before ending, everything worth keeping is merged or in an open pull request, and a blocked run queues its note with `objective-lease.mjs note` (or `abort` when holding the lease). Never publish pre-existing work or execute an uncommitted helper, and preserve the five rules in `clan/AGENTS.md`, the public-repo, secret-safety and privacy boundaries, the human boundary in `clan/AGENT-TEAM/WORKFLOW.md`, and the rule that live verification uses reads only: never write to Elixir, never manufacture an action decision, hold, note, grant or feedback item for acceptance. Keep automation memory to Current state, Active watches, and one replace-in-place Latest run. Do not claim shipped behavior from source publication alone."

