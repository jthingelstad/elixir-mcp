version = 2
repo = "."
timezone = "America/Chicago"

# Stable ids preserve Codex task history while names express durable
# objectives. Minute offsets deliberately avoid the elixir-bot team's
# slots (:10 twelve-hourly, 06:30, 08:00), the Librarian's daily 08:20,
# and the sysadmin Sunday runs (06:00, 07:00) so runs on the same host
# interleave.

