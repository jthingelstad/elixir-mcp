version = 2
repo = "."
timezone = "America/Chicago"

# Approved September 9, 2026; renamed, moved to one worktree per run and
# reinstalled September 29, 2026 at the cadences installed in Codex (the
# heavier September 9 cadences were superseded in the app). Calendar
# starts use local Chicago time. Each run gets its own worktree, prepared
# by local_environment_config_path (relative to the repository root;
# installed as an absolute path); the automation id, objective key and
# automation memory carried over from the old names. schedule_of entries
# share the original objective, lease, and automation memory. launch_cwd
# records the app launch directory relative to this checkout. Event-driven
# follow-ups remain explicit starts; these are calendar schedules.

[[automation]]
id = "run-elixir-mcp"
name = "Elixir Operator"
objective = "run"
objective_file = "AGENT-TEAM/elixir-operator.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=4;BYMINUTE=45"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "worktree"
local_environment_config_path = ".codex/environments/environment.toml"
launch_cwd = "."
prompt = "Follow the project instructions already loaded by Codex. This run has its own git worktree of elixir-mcp, prepared at a fresh origin/main by the repository's Codex environment; every path is relative to it. Read `AGENTS.md`, `docs/ENGINEERING.md`, `AGENT-TEAM/WORKFLOW.md`, `AGENT-TEAM/READING.md`, `AGENT-TEAM/README.md`, and `AGENT-TEAM/elixir-operator.md` completely; use the reading map to review current authoritative product contracts and changed decisions, then pursue the `run` objective (Elixir Operator) exactly as written. Run `AGENT-TEAM/scripts/preflight.sh` first and measure current production evidence before changing anything; a healthy no-op is success. Own a clear operational gap through source fix, regression coverage, `npm run verify`, deployment when required, and read-only live acceptance. If collector code must change, follow `docs/RELEASING-COLLECTOR.md`; a collector-repo push is only a candidate until this repo names the release. Edit only in this worktree, on a `run/<slug>` branch, and land every change as a pull request that merges on a green `validate`; main takes nothing else. Claim the `run` lease (`node AGENT-TEAM/scripts/objective-lease.mjs`) only immediately before a deploy, a migration run or an ops-lambda write, deploy from a fetched, detached origin/main, release it once production is verified, and never clear or break another holder's lease. This worktree is discarded after the run: before ending, everything worth keeping is merged or in an open pull request, and a blocked run queues its note with `objective-lease.mjs note` (or `abort` when holding the lease). Never publish pre-existing work or execute an uncommitted helper, and preserve the public-repo, secret-safety, privacy, one-budget, and live-read-only boundaries. Verify required deployment capabilities before editing runtime code. Record evidence and durable decisions in the prescribed notes. Do not claim shipped behavior from source publication alone."

