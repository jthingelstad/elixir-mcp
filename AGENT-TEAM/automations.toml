status = "ACTIVE"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=12;BYMINUTE=40"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "local"
prompt = "Follow the project instructions already loaded by Codex. Read `/Users/otto/Projects/elixir-mcp/docs/DESIGN.md`, the newest ratified decisions in `/Users/otto/Projects/elixir-mcp/docs/NOTES.md`, `/Users/otto/Projects/elixir-mcp/AGENT-TEAM/WORKFLOW.md`, `/Users/otto/Projects/elixir-mcp/AGENT-TEAM/README.md`, and `/Users/otto/Projects/elixir-mcp/AGENT-TEAM/run-elixir-mcp.md` completely, then pursue the `run` objective exactly as written. Run preflight first and measure current production evidence before changing anything; a healthy no-op is success. Own a clear operational gap through source fix, regression coverage, `npm run verify`, deployment when required, and read-only live acceptance. Acquire the `run` checkout lease only immediately before mutation, check it before the first edit and before push, never clear or break another holder's lease, never publish pre-existing work, release only from a clean checkout, and preserve the public-repo, secret-safety, privacy, one-budget, and live-read-only boundaries. If collector code must change, follow `docs/RELEASING-COLLECTOR.md`; a collector-repo push is only a candidate until this repo names the release. Record evidence and durable decisions in the prescribed notes."

